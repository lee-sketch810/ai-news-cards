# state.yaml — 일일 실행 진행 상태. Orchestrator만 수정한다. 에이전트는 읽기 전용.

workflow:
  name: "Daily AI News Card Pipeline"
  run_date: null            # 처리 중인 에디션 날짜 (YYYY-MM-DD)
  current_step: 0
  status: "idle"            # idle | in_progress | completed | failed

  # 단계별 산출물 — 다음 단계로 넘어가기 전 파일 존재 + 100 bytes 이상 확인
  outputs:
    # candidates: "data/research/candidates-YYYY-MM-DD.json"
    # verified:   "data/research/verified-YYYY-MM-DD.json"
    # top10:      "data/planning/top10-YYYY-MM-DD.json"
    # cards:      "data/cards-YYYY-MM-DD.json"
    # tip_review: "review-logs/tip-verify-YYYY-MM-DD.json"

  autopilot:
    enabled: true

  retries: {}               # 예: {card-writer: 1}
  notes: []                 # 통과 < 10, 카드 제외 사유 등
