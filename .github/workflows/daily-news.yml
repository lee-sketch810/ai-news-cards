name: Daily AI News Pipeline

# 매일 09:00 KST(=00:00 UTC)에 뉴스 수집→검증→카드작성→렌더→커밋/push까지 전부 실행한다.
# 예전에는 PC의 Claude Code 세션이 이 역할을 했는데, 그 세션이 꺼지면 조용히
# 멈춰버리는 문제가 있었다(2026-08-02 저녁 이후 발생). 이 워크플로우는 PC 상태와
# 무관하게 GitHub 서버에서 독립적으로 돌아간다.
#
# 최초 설정:
#   1. 저장소 Settings → Secrets and variables → Actions → New repository secret
#      이름: ANTHROPIC_API_KEY, 값: Anthropic 콘솔에서 발급한 API 키
#   2. 저장소 Settings → Actions → General → Workflow permissions
#      "Read and write permissions" 선택 (기본값은 read-only라 push가 막힘)
#   3. Actions 탭 → "Daily AI News Pipeline" → Run workflow 로 1회 수동 테스트
#      (정상 동작 확인 후에는 매일 자동 스케줄에 맡기면 됨)

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 09:00 KST
  workflow_dispatch: {}    # 수동 테스트용 "Run workflow" 버튼

permissions:
  contents: write

concurrency:
  group: daily-news-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_pipeline.py

      - name: Commit and push
        run: |
          git config user.name "ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ public/
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "news: auto-publish $(date -u +%Y-%m-%d) (GitHub Actions)"
            git push origin main
          fi

      - name: Upload run artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-research-${{ github.run_id }}
          path: |
            data/research/
            data/planning/
          retention-days: 7
          if-no-files-found: ignore
